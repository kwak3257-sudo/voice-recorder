<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f5f7fb" />
<title>보이스</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
  :root{
    --bg:#f5f7fb; --card:#ffffff; --txt:#1d2433; --muted:#8a93a6; --line:#e8ecf3;
    --mint:#12b886; --mintSoft:#e6f8f1; --blue:#4c6ef5; --blueSoft:#edf2ff;
    --red:#fa5252; --redSoft:#fff0f0; --r:22px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR","Segoe UI",Roboto,sans-serif;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);min-height:100%;transition:filter .3s}
  body.dim{filter:brightness(.15)}
  .wrap{max-width:520px;margin:0 auto;padding:0 16px 110px}

  header{display:flex;align-items:center;gap:10px;padding:18px 2px 14px}
  header h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.4px}
  .icon-btn{margin-left:auto;border:none;background:var(--card);width:42px;height:42px;border-radius:14px;
    font-size:19px;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer}
  .rec-chip{display:none;align-items:center;gap:6px;background:var(--redSoft);color:var(--red);
    border-radius:999px;padding:6px 11px;font-size:12px;font-weight:700}
  .rec-chip i{width:7px;height:7px;border-radius:50%;background:var(--red);animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.25}}

  .card{background:var(--card);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(20,30,60,.05)}

  /* 언어 선택 */
  .langs{display:flex;align-items:center;gap:8px}
  .langs select{flex:1;min-width:0}
  .langs .to{font-size:18px;color:var(--muted)}
  select{appearance:none;width:100%;border:1.5px solid var(--line);background:#fafbfd;border-radius:14px;
    padding:12px 12px;font-size:15px;font-weight:600;color:var(--txt);font-family:inherit;outline:none}
  select:focus{border-color:var(--blue)}

  /* 녹음 */
  .rec{text-align:center;padding:26px 18px 22px}
  .timer{font-size:46px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-1px}
  .sub{color:var(--muted);font-size:14px;margin-top:4px;min-height:20px}
  .rec-btn{margin:20px auto 0;width:96px;height:96px;border-radius:50%;border:none;cursor:pointer;
    background:var(--red);font-size:40px;line-height:96px;color:#fff;
    box-shadow:0 10px 26px rgba(250,82,82,.35);transition:transform .1s,background .2s}
  .rec-btn:active{transform:scale(.93)}
  .rec-btn.on{background:#343a40;box-shadow:0 10px 26px rgba(52,58,64,.3);animation:ring 1.6s infinite}
  @keyframes ring{0%{box-shadow:0 0 0 0 rgba(250,82,82,.45)}70%{box-shadow:0 0 0 18px rgba(250,82,82,0)}100%{box-shadow:0 0 0 0 rgba(250,82,82,0)}}

  /* 원문 / 번역 */
  .pane-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .pane-h b{font-size:14px;font-weight:700}
  .tag{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px}
  .tag.src{background:var(--blueSoft);color:var(--blue)}
  .tag.tr{background:var(--mintSoft);color:var(--mint)}
  .text{font-size:17px;line-height:1.65;min-height:52px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
  .text.tr{color:#0b7a5a}
  .ph{color:var(--muted);font-size:15px}
  .interim{color:var(--muted)}
  .mini{border:none;background:#f1f3f7;border-radius:10px;padding:7px 11px;font-size:13px;font-weight:600;cursor:pointer;color:var(--txt);font-family:inherit}

  textarea{width:100%;min-height:120px;border:1.5px solid var(--line);background:#fafbfd;border-radius:14px;
    padding:13px;font-size:16px;line-height:1.6;font-family:inherit;color:var(--txt);outline:none;resize:vertical}
  textarea:focus{border-color:var(--blue)}

  /* 보관함 */
  .item{padding:16px 0;border-bottom:1px solid var(--line)}
  .item:first-child{padding-top:2px}
  .item:last-child{border-bottom:none;padding-bottom:2px}
  .item-h{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700}
  .item-h span{color:var(--muted);font-weight:600;font-size:13px}
  audio{width:100%;height:40px;margin:10px 0 6px}
  .item .text{font-size:15px;min-height:0;margin-top:8px}
  .lbl{font-size:12px;font-weight:700;margin-top:10px}
  .lbl.src{color:var(--blue)} .lbl.tr{color:var(--mint)}
  .dl{display:flex;gap:8px;margin-top:12px}
  .dl button{flex:1;border:none;border-radius:12px;padding:11px 6px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
  .dl .a{background:var(--blueSoft);color:var(--blue)}
  .dl .t{background:var(--mintSoft);color:var(--mint)}
  .dl .x{flex:0 0 46px;background:#f1f3f7}
  .empty{text-align:center;color:var(--muted);padding:30px 0;font-size:15px}
  .empty div{font-size:40px;margin-bottom:8px}

  /* 하단 탭 */
  nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:10}
  nav .in{display:flex;width:100%;max-width:520px}
  nav button{flex:1;border:none;background:none;font-family:inherit;cursor:pointer;color:var(--muted);
    font-size:12px;font-weight:700;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
  nav button .e{font-size:23px;filter:grayscale(1);opacity:.55;transition:.2s}
  nav button.on{color:var(--txt)}
  nav button.on .e{filter:none;opacity:1;transform:scale(1.08)}
  .hidden{display:none!important}
  .toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#1d2433;color:#fff;padding:11px 18px;
    border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:20;white-space:nowrap}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎙️ 보이스</h1>
    <span class="rec-chip" id="chip"><i></i>녹음 중</span>
    <button class="icon-btn" id="dimBtn" title="화면 어둡게">🌙</button>
  </header>

  <!-- 🎙️ 녹음 -->
  <section id="tab-rec">
    <div class="card">
      <div class="langs">
        <select id="recLang" aria-label="말하는 언어"></select>
        <span class="to">➜</span>
        <select id="recTgt" aria-label="번역 언어"></select>
      </div>
    </div>

    <div class="card rec">
      <div class="timer" id="timer">00:00</div>
      <div class="sub" id="sub">버튼을 누르면 녹음이 시작돼요</div>
      <button class="rec-btn" id="recBtn" aria-label="녹음">🎙️</button>
    </div>

    <div class="card">
      <div class="pane-h"><b>🗣️ 원문</b><button class="mini" data-copy="src">📋 복사</button></div>
      <div class="text" id="srcBox"><span class="ph">말하면 여기에 글자로 나타나요</span></div>
    </div>
    <div class="card">
      <div class="pane-h"><b>🌐 번역</b><button class="mini" data-copy="tr">📋 복사</button></div>
      <div class="text tr" id="trBox"><span class="ph">번역이 자동으로 함께 나와요</span></div>
    </div>
  </section>

  <!-- 🌐 텍스트 번역 -->
  <section id="tab-text" class="hidden">
    <div class="card">
      <div class="langs">
        <select id="srcLang" aria-label="원문 언어"></select>
        <button class="mini" id="swap" aria-label="언어 바꾸기">🔄</button>
        <select id="tgtLang" aria-label="번역 언어"></select>
      </div>
    </div>
    <div class="card">
      <div class="pane-h"><b>✏️ 입력</b><button class="mini" id="clearIn">🧹 지우기</button></div>
      <textarea id="srcText" placeholder="입력하면 바로 번역돼요"></textarea>
    </div>
    <div class="card">
      <div class="pane-h"><b>🌐 번역</b>
        <span><button class="mini" id="speak">🔊</button> <button class="mini" id="copyOut">📋 복사</button></span></div>
      <div class="text tr" id="outBox"><span class="ph">번역 결과가 여기에 나와요</span></div>
    </div>
  </section>

  <!-- 📁 보관함 -->
  <section id="tab-list" class="hidden">
    <div class="card" id="list"></div>
  </section>
</div>

<nav><div class="in">
  <button data-tab="rec" class="on"><span class="e">🎙️</span>녹음</button>
  <button data-tab="text"><span class="e">🌐</span>번역</button>
  <button data-tab="list"><span class="e">📁</span>보관함</button>
</div></nav>
<div class="toast" id="toast"></div>

<script>
const LANGS=[["ko-KR","🇰🇷 한국어"],["en-US","🇺🇸 English"],["ja-JP","🇯🇵 日本語"],["zh-CN","🇨🇳 中文(简)"],["zh-TW","🇹🇼 中文(繁)"],
  ["es-ES","🇪🇸 Español"],["fr-FR","🇫🇷 Français"],["de-DE","🇩🇪 Deutsch"],["vi-VN","🇻🇳 Tiếng Việt"],["th-TH","🇹🇭 ไทย"],
  ["id-ID","🇮🇩 Indonesia"],["ru-RU","🇷🇺 Русский"],["pt-BR","🇧🇷 Português"],["it-IT","🇮🇹 Italiano"],["ar-SA","🇸🇦 العربية"],["hi-IN","🇮🇳 हिन्दी"]];
const $=id=>document.getElementById(id);
const nameOf=c=>(LANGS.find(l=>l[0]===c)||[,c])[1].replace(/^\S+\s/,"");
const store={get(k,d){try{return localStorage.getItem(k)||d}catch{return d}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
function fill(sel,key,def){LANGS.forEach(([c,n])=>sel.add(new Option(n,c)));sel.value=store.get(key,def);sel.addEventListener("change",()=>store.set(key,sel.value));}
fill($("recLang"),"recLang","ko-KR");fill($("recTgt"),"recTgt","en-US");fill($("srcLang"),"srcLang","ko-KR");fill($("tgtLang"),"tgtLang","en-US");
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const debounce=(f,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms)}};
let tt;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),1700)}
const fmt=ms=>{const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};

/* 탭 */
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));
  ["rec","text","list"].forEach(t=>$("tab-"+t).classList.toggle("hidden",t!==b.dataset.tab));
  if(b.dataset.tab==="list")renderList();
});
$("dimBtn").onclick=()=>{const on=document.body.classList.toggle("dim");toast(on?"🌙 화면을 어둡게 했어요":"☀️ 원래 밝기")};

/* 번역 */
async function translate(text,from,to){
  const a=from.split("-")[0],b=to.split("-")[0];
  if(a===b&&from===to)return text;
  const g=c=>c.startsWith("zh")?c:c.split("-")[0];
  try{
    const r=await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl="+g(from)+"&tl="+g(to)+"&q="+encodeURIComponent(text));
    if(r.ok){const j=await r.json();const s=j[0].map(x=>x[0]).join("");if(s)return s}
  }catch{}
  const r=await fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(text)+"&langpair="+a+"|"+b);
  if(!r.ok)throw new Error("net");
  return (await r.json()).responseData.translatedText;
}

/* 녹음 + 받아쓰기 + 번역(항상) */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let mr,chunks=[],stream,t0,timer,rec,listening=false,wake=null,interim="";
let segs=[]; // {src, tr, p}
function srcText(){return segs.map(s=>s.src).join(" ").trim()}
function trText(){return segs.map(s=>s.tr||"").join(" ").trim()}
function render(){
  const s=srcText();
  $("srcBox").innerHTML=(s||interim)?esc(s)+(interim?' <span class="interim">'+esc(interim)+"</span>":""):'<span class="ph">말하면 여기에 글자로 나타나요</span>';
  const t=trText(),pending=segs.some(x=>x.tr==null);
  $("trBox").innerHTML=t?esc(t)+(pending?' <span class="interim">…</span>':""):(pending?'<span class="ph">번역 중…</span>':'<span class="ph">번역이 자동으로 함께 나와요</span>');
}
function addSeg(text){
  const seg={src:text.trim(),tr:null};if(!seg.src)return;
  segs.push(seg);render();
  seg.p=translate(seg.src,$("recLang").value,$("recTgt").value).then(r=>seg.tr=r).catch(()=>seg.tr="(번역 실패)").finally(render);
}
$("recTgt").addEventListener("change",()=>segs.forEach(seg=>{seg.tr=null;seg.p=translate(seg.src,$("recLang").value,$("recTgt").value).then(r=>seg.tr=r).catch(()=>seg.tr="(번역 실패)").finally(render)}));

async function start(){
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}
  catch{toast("🎙️ 마이크 권한을 허용해 주세요");return}
  segs=[];interim="";render();chunks=[];
  const mime=["audio/webm;codecs=opus","audio/webm","audio/mp4"].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m));
  mr=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);
  mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  mr.onstop=save;mr.start(1000);
  t0=Date.now();timer=setInterval(()=>$("timer").textContent=fmt(Date.now()-t0),250);
  $("recBtn").classList.add("on");$("recBtn").textContent="⏹️";$("chip").style.display="flex";
  $("sub").textContent=SR?"듣고 있어요… 다시 누르면 저장돼요":"녹음 중 (받아쓰기는 Chrome에서 지원)";
  try{wake=await navigator.wakeLock.request("screen")}catch{}
  if(SR)listen();
}
function stop(){
  listening=false;try{rec&&rec.stop()}catch{}
  if(interim){addSeg(interim);interim=""}
  if(mr&&mr.state!=="inactive")mr.stop();
  stream&&stream.getTracks().forEach(t=>t.stop());
  clearInterval(timer);$("recBtn").classList.remove("on");$("recBtn").textContent="🎙️";$("chip").style.display="none";
  $("sub").textContent="💾 저장 중…";
  try{wake&&wake.release()}catch{}wake=null;
}
$("recBtn").onclick=()=>mr&&mr.state==="recording"?stop():start();

function listen(){
  rec=new SR();rec.lang=$("recLang").value;rec.continuous=true;rec.interimResults=true;listening=true;
  rec.onresult=e=>{
    interim="";
    for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];r.isFinal?addSeg(r[0].transcript):interim+=r[0].transcript}
    render();
  };
  rec.onerror=e=>{if(e.error==="not-allowed")$("sub").textContent="받아쓰기 권한이 꺼져 있어요"};
  rec.onend=()=>{if(listening){if(interim){addSeg(interim);interim=""}setTimeout(()=>{try{rec.start()}catch{}},150)}};
  try{rec.start()}catch{}
}

document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{
  const v=b.dataset.copy==="src"?srcText():trText();
  if(!v)return toast("복사할 내용이 없어요");
  navigator.clipboard.writeText(v).then(()=>toast("📋 복사했어요"));
});

/* 저장 (IndexedDB) */
let db;
const dbReady=new Promise(res=>{try{const r=indexedDB.open("vr-db",1);r.onupgradeneeded=()=>r.result.createObjectStore("recs",{keyPath:"id"});r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>res()}catch{res()}});
async function save(){
  const dur=Date.now()-t0;
  await Promise.race([Promise.all(segs.map(s=>s.p)),new Promise(r=>setTimeout(r,6000))]);
  if(!chunks.length){$("sub").textContent="버튼을 누르면 녹음이 시작돼요";return}
  const item={id:Date.now(),blob:new Blob(chunks,{type:chunks[0].type||"audio/webm"}),dur,date:new Date().toISOString(),
    from:$("recLang").value,to:$("recTgt").value,src:srcText(),tr:trText()};
  await dbReady;
  if(!db){toast("저장소를 쓸 수 없어요");return}
  const tx=db.transaction("recs","readwrite");tx.objectStore("recs").put(item);
  tx.oncomplete=()=>{toast("✅ 보관함에 저장했어요");$("sub").textContent="✅ 저장됨 · 📁 보관함에서 받을 수 있어요"};
}
function all(){return new Promise(res=>{if(!db)return res([]);const out=[];db.transaction("recs").objectStore("recs").openCursor(null,"prev").onsuccess=e=>{const c=e.target.result;if(c){out.push(c.value);c.continue()}else res(out)}})}
function del(id){return new Promise(res=>{const tx=db.transaction("recs","readwrite");tx.objectStore("recs").delete(id);tx.oncomplete=res})}

function stamp(d){const p=n=>String(n).padStart(2,"0");return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"_"+p(d.getHours())+p(d.getMinutes())}
function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
function textFile(it){
  const d=new Date(it.date);
  return "🎙️ 보이스 녹음 기록\n"+
    "날짜: "+d.toLocaleString("ko-KR")+"\n길이: "+fmt(it.dur)+"\n언어: "+nameOf(it.from)+" → "+nameOf(it.to)+"\n\n"+
    "──── 🗣️ 원문 ────\n"+(it.src||"(받아쓴 내용 없음)")+"\n\n"+
    "──── 🌐 번역 ────\n"+(it.tr||"(번역 없음)")+"\n";
}

async function renderList(){
  await dbReady;const items=await all();const L=$("list");
  if(!items.length){L.innerHTML='<div class="empty"><div>📭</div>아직 녹음이 없어요</div>';return}
  L.innerHTML="";
  items.forEach(it=>{
    const d=new Date(it.date),url=URL.createObjectURL(it.blob),base="voice_"+stamp(d);
    const ext=it.blob.type.includes("mp4")?".m4a":".webm";
    const el=document.createElement("div");el.className="item";
    el.innerHTML=`<div class="item-h">🗓️ ${d.toLocaleString("ko-KR",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})}<span>⏱️ ${fmt(it.dur)}</span></div>
      <audio controls preload="metadata" src="${url}"></audio>
      ${it.src?`<div class="lbl src">🗣️ 원문 · ${esc(nameOf(it.from))}</div><div class="text">${esc(it.src)}</div>`:""}
      ${it.tr?`<div class="lbl tr">🌐 번역 · ${esc(nameOf(it.to))}</div><div class="text tr">${esc(it.tr)}</div>`:""}
      <div class="dl"><button class="a">🎧 음성 받기</button><button class="t">📝 텍스트 받기</button><button class="x" aria-label="삭제">🗑️</button></div>`;
    el.querySelector(".a").onclick=()=>{download(it.blob,base+ext);toast("🎧 음성 파일을 받았어요")};
    el.querySelector(".t").onclick=()=>{download(new Blob(["﻿"+textFile(it)],{type:"text/plain;charset=utf-8"}),base+".txt");toast("📝 텍스트 파일을 받았어요")};
    el.querySelector(".x").onclick=async()=>{if(confirm("이 녹음을 지울까요?")){await del(it.id);renderList()}};
    L.appendChild(el);
  });
}

/* 텍스트 번역 (입력 즉시) */
const runText=debounce(async()=>{
  const v=$("srcText").value.trim(),o=$("outBox");
  if(!v){o.innerHTML='<span class="ph">번역 결과가 여기에 나와요</span>';return}
  o.innerHTML='<span class="ph">번역 중…</span>';
  try{o.textContent=await translate(v,$("srcLang").value,$("tgtLang").value)}catch{o.innerHTML='<span class="ph">⚠️ 인터넷 연결을 확인해 주세요</span>'}
},450);
$("srcText").addEventListener("input",runText);$("srcLang").addEventListener("change",runText);$("tgtLang").addEventListener("change",runText);
$("swap").onclick=()=>{const a=$("srcLang").value;$("srcLang").value=$("tgtLang").value;$("tgtLang").value=a;
  store.set("srcLang",$("srcLang").value);store.set("tgtLang",$("tgtLang").value);
  const o=$("outBox").textContent;if(o&&!$("outBox").querySelector(".ph"))$("srcText").value=o;runText()};
$("clearIn").onclick=()=>{$("srcText").value="";runText()};
$("copyOut").onclick=()=>{const o=$("outBox");if(o.querySelector(".ph"))return toast("복사할 내용이 없어요");navigator.clipboard.writeText(o.textContent).then(()=>toast("📋 복사했어요"))};
$("speak").onclick=()=>{const o=$("outBox");if(o.querySelector(".ph"))return;const u=new SpeechSynthesisUtterance(o.textContent);u.lang=$("tgtLang").value;speechSynthesis.cancel();speechSynthesis.speak(u)};

if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
